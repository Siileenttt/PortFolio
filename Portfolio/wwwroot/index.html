<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio: experience, projects, skills and education." />
    <title>Portfolio</title>
    <!-- GitHub Pages workflow rewrites this to /<repo-name>/ automatically. Keep it as "/" here. -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="state-message"><p>Loading portfolio…</p></div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong while running the page.
        <a href="" class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
